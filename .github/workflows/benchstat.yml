# Benchmarks are intentionally manual: running both the current revision and
# main five times is too expensive for every pull request.
name: benchstat

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: 1.25.x

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout incoming revision
        uses: actions/checkout@v7
        with:
          path: incoming

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          path: current

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            incoming/go.sum
            current/go.sum

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Benchmark incoming revision
        working-directory: incoming
        run: go test -p=1 -run='^$' -bench=. -count=5 -timeout=60m ./... | tee ../new.txt

      - name: Benchmark main
        working-directory: current
        run: go test -p=1 -run='^$' -bench=. -count=5 -timeout=60m ./... | tee ../old.txt

      - name: Compare benchmarks
        run: |
          "$(go env GOPATH)/bin/benchstat" old.txt new.txt | tee benchstat.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchstat
          path: |
            old.txt
            new.txt
            benchstat.txt
