name: Release

# The tools tag is the sole trigger for beta and stable v1 releases. Root, x,
# and tools tags are sent in one atomic push, so every module ref is visible
# before this workflow validates the dependency graph or publishes artifacts.
on:
  push:
    tags:
      - "tools/v1.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.25.0

jobs:
  prepare:
    name: Validate release tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      x_tag: ${{ steps.release.outputs.x_tag }}
      tools_tag: ${{ steps.release.outputs.tools_tag }}
      release_channel: ${{ steps.release.outputs.release_channel }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate module tags and embedded version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tools_tag="$GITHUB_REF_NAME"
          release_tag="${tools_tag#tools/}"
          x_tag="x/${release_tag}"

          stable_re='^v1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          beta_re='^v1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.[1-9][0-9]*$'
          if [[ "$release_tag" =~ $stable_re ]]; then
            release_channel="stable"
          elif [[ "$release_tag" =~ $beta_re ]]; then
            release_channel="beta"
          else
            echo "Expected tools/v1.X.Y or tools/v1.X.Y-beta.N; got $tools_tag" >&2
            exit 1
          fi

          expected_version="${release_tag#v}"
          embedded_version="$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' internal/base/base.go)"
          if [ "$embedded_version" != "$expected_version" ]; then
            echo "internal/base.Version=$embedded_version, expected $expected_version" >&2
            exit 1
          fi

          for tag in "$release_tag" "$x_tag" "$tools_tag"; do
            git rev-parse --verify "${tag}^{commit}" >/dev/null
          done

          root_commit="$(git rev-list -n 1 "$release_tag")"
          x_commit="$(git rev-list -n 1 "$x_tag")"
          tools_commit="$(git rev-list -n 1 "$tools_tag")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$root_commit" != "$x_commit" ] || \
             [ "$root_commit" != "$tools_commit" ] || \
             [ "$root_commit" != "$head_commit" ]; then
            echo "Root, x, and tools release tags must point at this same commit" >&2
            exit 1
          fi

          if ! awk -v version="$release_tag" \
            '$1 == "github.com/pars-aria-labs/asynq" && $2 == version { found=1 } END { exit !found }' \
            x/go.mod; then
            echo "x/go.mod does not require the matching root release" >&2
            exit 1
          fi
          if ! awk -v version="$release_tag" \
            '$1 == "github.com/pars-aria-labs/asynq" && $2 == version { found=1 } END { exit !found }' \
            tools/go.mod; then
            echo "tools/go.mod does not require the matching root release" >&2
            exit 1
          fi
          if ! awk -v version="$release_tag" \
            '$1 == "github.com/pars-aria-labs/asynq/x" && $2 == version { found=1 } END { exit !found }' \
            tools/go.mod; then
            echo "tools/go.mod does not require the matching x release" >&2
            exit 1
          fi

          # README records the historical copy source. Operational files must
          # use only the canonical repository identity.
          legacy_refs="$(
            git grep -nE \
              'github\.com/[^/]+/asynq([^[:alnum:]_.-]|$)' -- . \
              | grep -vE '^README\.md:' \
              | grep -vE \
                'github\.com/pars-aria-labs/asynq([^[:alnum:]_.-]|$)' \
              || true
          )"
          if [ -n "$legacy_refs" ]; then
            printf '%s\n' "$legacy_refs" >&2
            echo "Legacy Asynq repository identity found in the release tree" >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "x_tag=$x_tag" >> "$GITHUB_OUTPUT"
          echo "tools_tag=$tools_tag" >> "$GITHUB_OUTPUT"
          echo "release_channel=$release_channel" >> "$GITHUB_OUTPUT"

  full-quality:
    name: Full standalone, cluster, and Asynqmon checks
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      asynqmon_ref: 63a56205133bb09aac3676c93007d71dfb8bed34

  module-graph:
    name: Verify published module graph
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            x/go.sum
            tools/go.sum

      - name: Test modules without workspace replacements
        env:
          GOWORK: "off"
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        shell: bash
        run: |
          set -euo pipefail

          go mod tidy
          go test ./... -run='^$'
          go vet ./...

          (
            cd x
            go mod tidy
            go test ./... -run='^$'
            go vet ./...
          )

          (
            cd tools
            go mod tidy
            go test ./... -run='^$'
            go vet ./...
          )

          git diff --exit-code -- go.mod x/go.mod tools/go.mod

  build:
    name: Build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [prepare, full-quality, module-graph]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            format: tar.gz
          - goos: linux
            goarch: arm64
            format: tar.gz
          - goos: darwin
            goarch: amd64
            format: tar.gz
          - goos: darwin
            goarch: arm64
            format: tar.gz
          - goos: windows
            goarch: amd64
            format: zip
          - goos: windows
            goarch: arm64
            format: zip
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/go.sum

      - name: Build archive
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          ARCHIVE_FORMAT: ${{ matrix.format }}
          GOWORK: "off"
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          archive_base="asynq_${version}_${TARGET_OS}_${TARGET_ARCH}"
          package_dir="dist/package"
          binary="asynq"
          if [ "$TARGET_OS" = windows ]; then
            binary="asynq.exe"
          fi

          mkdir -p "$package_dir"
          (
            cd tools
            CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" \
              go build -trimpath -ldflags='-s -w' \
                -o "../$package_dir/$binary" ./asynq
          )
          cp README.md CHANGELOG.md LICENSE "$package_dir/"
          touch -t 202001010000 "$package_dir"/*

          if [ "$ARCHIVE_FORMAT" = zip ]; then
            (cd "$package_dir" && zip -q -X "../${archive_base}.zip" \
              "$binary" README.md CHANGELOG.md LICENSE)
          else
            tar --sort=name \
              --mtime='UTC 2020-01-01' \
              --owner=0 --group=0 --numeric-owner \
              -C "$package_dir" \
              -czf "dist/${archive_base}.tar.gz" \
              "$binary" README.md CHANGELOG.md LICENSE
          fi

      - name: Verify native Linux binary version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          output="$(dist/package/asynq version)"
          test "$output" = "asynq version ${RELEASE_TAG#v}"

      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/asynq_*

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/asynq_*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          mapfile -t archives < <(
            find . -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' \) \
              -printf '%f\n' | sort
          )
          if [ "${#archives[@]}" -ne 6 ]; then
            echo "Expected 6 release archives, found ${#archives[@]}" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create or recover draft and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          X_TAG: ${{ needs.prepare.outputs.x_tag }}
          TOOLS_TAG: ${{ needs.prepare.outputs.tools_tag }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.release_channel }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"
          gh api --method POST \
            "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            --jq .body > "$notes_file"

          case "$RELEASE_CHANNEL" in
            beta)
              release_title="Asynq ${RELEASE_TAG} (Beta)"
              create_channel_args=(--prerelease --latest=false)
              draft_channel_args=(--prerelease --latest=false)
              publish_channel_args=(--prerelease --latest=false)
              ;;
            stable)
              release_title="Asynq ${RELEASE_TAG}"
              create_channel_args=(--latest=false)
              draft_channel_args=(--prerelease=false --latest=false)
              publish_channel_args=(--prerelease=false --latest)
              ;;
            *)
              echo "Unsupported release channel: $RELEASE_CHANNEL" >&2
              exit 1
              ;;
          esac

          for tag in "$RELEASE_TAG" "$X_TAG" "$TOOLS_TAG"; do
            remote_commit="$({
              git ls-remote --tags origin "refs/tags/${tag}^{}"
              git ls-remote --tags origin "refs/tags/${tag}"
            } | awk 'NR == 1 { print $1 }')"
            if [ "$remote_commit" != "$GITHUB_SHA" ]; then
              echo "$tag resolves to $remote_commit, expected $GITHUB_SHA" >&2
              exit 1
            fi
          done

          release_error_file="$(mktemp)"
          if release_state="$(
            gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" \
              --jq .draft 2>"$release_error_file"
          )"; then
            release_exists=true
          elif grep -Fq 'HTTP 404' "$release_error_file"; then
            release_exists=false
          else
            echo "Unable to inspect release $RELEASE_TAG" >&2
            cat "$release_error_file" >&2
            exit 1
          fi

          if [ "$release_exists" = false ]; then
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "$release_title" \
              --notes-file "$notes_file" \
              --draft \
              "${create_channel_args[@]}"
          elif [ "$release_state" = true ]; then
            gh release edit "$RELEASE_TAG" \
              --title "$release_title" \
              --notes-file "$notes_file" \
              --draft \
              "${draft_channel_args[@]}"

            prior_assets="$(
              gh release view "$RELEASE_TAG" --json assets \
                --jq '.assets[].name'
            )"
            if [ -n "$prior_assets" ]; then
              while IFS= read -r asset; do
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
              done <<<"$prior_assets"
            fi
            gh release upload "$RELEASE_TAG" dist/*
          elif [ "$release_state" = false ]; then
            echo "Published release $RELEASE_TAG already exists; refusing to replace it" >&2
            exit 1
          else
            echo "Unexpected draft state for $RELEASE_TAG: $release_state" >&2
            exit 1
          fi

          expected_assets="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual_assets="$(
            gh release view "$RELEASE_TAG" --json assets \
              --jq '.assets[].name' | sort
          )"
          if [ "$actual_assets" != "$expected_assets" ]; then
            echo "Draft release assets do not match the validated build" >&2
            diff -u <(printf '%s\n' "$expected_assets") \
              <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi

          gh release edit "$RELEASE_TAG" \
            --draft=false \
            "${publish_channel_args[@]}"
